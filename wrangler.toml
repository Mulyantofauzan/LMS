name = "lms-saas"
main = ".open-next/worker.js"
compatibility_date = "2026-05-23"
account_id = "9b1af6bc3a904d61ae92200bf30a831a"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "lms-saas"

[[d1_databases]]
binding = "DB"
database_name = "lms-saas-db"
database_id = "236db5d3-2cf2-449b-8fb2-7d6a25fb2bb3"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "TRAINING_MATERIALS"
bucket_name = "lms-saas-training-materials"

[vars]
NEXTJS_ENV = "production"
AUTH_TRUST_HOST = "true"
# Optional. If empty, files are served through /api/materials/:key from the private R2 binding.
# R2_PUBLIC_URL = "https://materials.example.com"
